name: release

# Releases are cut by pushing a version tag. `workflow_dispatch` exists so the same job can be run
# by hand without publishing: it builds and uploads the zip as a workflow artifact, and the release
# step is skipped because the ref is not a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # `pnpm install` provides the Electron package; its runtime is fetched separately, because
      # Electron 44 no longer downloads it in a postinstall. `app:package` runs `install-electron`
      # for that, then copies node_modules/electron/dist into the artifact.
      - run: pnpm install --frozen-lockfile

      # The analysis environment, from the pinned lockfile — `uv` supplies the interpreter it
      # resolves (CPython 3.13.5). Both later steps need it: without it `pnpm verify` skips every
      # test that runs a recipe, and `app:package:check` refuses because `bench.cmd run fit` needs
      # an interpreter for the recipe the artifact ships.
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.13'

      - name: Set up the analysis environment
        run: pnpm setup:recipes

      # Typecheck, bundle the core and CLI, and run the whole test suite — including the analysis
      # tests, because the environment above is in place. `verify` opens no window.
      - run: pnpm verify

      - run: pnpm app:package

      # The artifact is the deliverable, so it is run rather than assumed to work: the check starts
      # bench.exe and reads the panels and marks it painted, types into a tab with axes of its own,
      # then drives `bench.cmd` with Node and Python removed from PATH. It compares the run against
      # `docs/ui-review/app-packaged.json` and writes that file only with `--record`, so a plain run
      # leaves the tree clean. Windows-gated because the packaged path exists only on win32-x64.
      - name: Check the packaged build
        if: runner.os == 'Windows'
        run: pnpm app:package:check

      # The exe and its CLI are what the release is for, so both are exercised before anything is
      # uploaded. `--help` needs no Python and no Node.
      - name: Smoke the packaged CLI
        shell: pwsh
        run: |
          & artifacts\bench-win32-x64\bench.cmd --help | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "bench.cmd --help exited $LASTEXITCODE" }

      - name: Zip the artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "bench-$tag-win32-x64.zip"
          7z a -tzip -mx=5 $zip .\artifacts\bench-win32-x64 | Select-Object -Last 3
          if (-not (Test-Path $zip)) { throw "7z produced no $zip" }
          Write-Host "${zip}: $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-win32-x64
          path: bench-*-win32-x64.zip
          retention-days: 7

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "bench-$tag-win32-x64.zip"
          gh release create $tag $zip --title "bench $tag" --generate-notes --verify-tag
