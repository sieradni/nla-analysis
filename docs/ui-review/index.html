<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bench — desktop shell review</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, 'Segoe UI', system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #f5f5f3;
        color: #1b1d1f;
        padding: 24px 28px 56px;
      }
      h1 {
        font-size: 19px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 24px;
        color: #71767c;
        font-size: 13px;
      }
      figure {
        margin: 0 0 28px;
        background: #fff;
        border: 1px solid #e6e7e4;
        border-radius: 6px;
        overflow: hidden;
      }
      figcaption {
        padding: 8px 12px;
        border-bottom: 1px solid #e6e7e4;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        color: #4a4f55;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <h1>bench desktop shell — review frames</h1>
    <p>
      Captured from the real Electron window by <code>pnpm app:capture</code> — the default run on
      fixtures/projects/drift-sensor, tab “drift over time”, then a read-only axis run on the live
      QP Stats project for the field-pair frames at the end.
    </p>
    <figure>
      <figcaption>100% scaling — app-100.png</figcaption>
      <img src="app-100.png" alt="bench window at 100% scaling" />
    </figure>
    <figure>
      <figcaption>125% scaling — app-125.png</figcaption>
      <img src="app-125.png" alt="bench window at 125% scaling" />
    </figure>
    <figure>
      <figcaption>150% scaling — app-150.png</figcaption>
      <img src="app-150.png" alt="bench window at 150% scaling" />
    </figure>
    <figure>
      <figcaption>hover, zoom (2.1×) and pan — app-interaction.png</figcaption>
      <img src="app-interaction.png" alt="bench window after wheel zoom and hover" />
    </figure>
    <figure>
      <figcaption>a typed point lands: 6.5 / 16.4, Enter — app-entry.png</figcaption>
      <img src="app-entry.png" alt="bench window after a point was typed into the entry bar" />
    </figure>
    <figure>
      <figcaption>undo (Ctrl+Z): a retraction, and the panels are current again — app-undo.png</figcaption>
      <img src="app-undo.png" alt="bench window after undo retracted the point" />
    </figure>
    <figure>
      <figcaption>a refusal keeps the typo and names both fields — app-refused.png</figcaption>
      <img src="app-refused.png" alt="bench window showing a rejected entry with the typed text kept" />
    </figure>
    <figure>
      <figcaption>the CLI appended behind it: n = 16, and the bar says it reread — app-second-writer.png</figcaption>
      <img src="app-second-writer.png" alt="bench window after a point was typed while the CLI had appended one" />
    </figure>
    <figure>
      <figcaption>a point corrected by selecting it: y 2.55 → 24.5, and the fitted panel is stale — app-corrected.png</figcaption>
      <img src="app-corrected.png" alt="bench window after a point was corrected from the selected mark" />
    </figure>
    <figure>
      <figcaption>a tab built from the dialog: main · drift · tentative · n = 14 — app-new-tab.png</figcaption>
      <img src="app-new-tab.png" alt="bench window showing a tab created from the dataset and recipe dialog" />
    </figure>
    <figure>
      <figcaption>the new project's first tab, created before any point: n = 0, axes mass/extension, and the shape's own add command — app-empty-tab-100.png</figcaption>
      <img src="app-empty-tab-100.png" alt="bench window showing an empty first tab for a custom shape" />
    </figure>
    <figure>
      <figcaption>the same empty tab at 125% — app-empty-tab-125.png</figcaption>
      <img src="app-empty-tab-125.png" alt="bench window showing the empty first tab at 125% scaling" />
    </figure>
    <figure>
      <figcaption>the same empty tab at 150% — app-empty-tab-150.png</figcaption>
      <img src="app-empty-tab-150.png" alt="bench window showing the empty first tab at 150% scaling" />
    </figure>
    <figure>
      <figcaption>a project created with its own shape: load.v1 (mass, extension), one point typed into its first tab — app-new-project.png</figcaption>
      <img src="app-new-project.png" alt="bench window showing a newly created project and its first point" />
    </figure>
    <figure>
      <figcaption>a custom-axis tab driven through the window: mass/extension, the first redraw, a patched second point, and a third point that moves the axes — app-custom-axis.png</figcaption>
      <img src="app-custom-axis.png" alt="bench window showing a custom-axis tab with three painted points and axes mass and extension" />
    </figure>
    <figure>
      <figcaption>the CLI appended while it sat idle: n = 15 and 15 marks, without a keystroke — app-live.png</figcaption>
      <img src="app-live.png" alt="bench window after the CLI appended a point to the open tab" />
    </figure>
    <figure>
      <figcaption>the open tab replaced by another writer: one panel, reread and redrawn — app-tab-replaced.png</figcaption>
      <img src="app-tab-replaced.png" alt="bench window after the open tab file was replaced" />
    </figure>
    <figure>
      <figcaption>the open tab deleted: a named empty state, and the bar still knows its target — app-tab-gone.png</figcaption>
      <img src="app-tab-gone.png" alt="bench window showing the empty state for a tab deleted on disk" />
    </figure>
    <figure>
      <figcaption>importing a messy CSV: x ← temp_c, y ← volts, previewed before anything is written — app-import.png</figcaption>
      <img src="app-import.png" alt="bench window showing the import dialog with a mapped preview of a CSV" />
    </figure>
    <figure>
      <figcaption>a file with no clock: the sheet plans nothing until a time column is chosen, and Import refuses without appending — app-import-untimed.png</figcaption>
      <img src="app-import-untimed.png" alt="bench import sheet saying to choose the column that holds the observation time" />
    </figure>
    <figure>
      <figcaption>a clock named taken_at: the picker offers it, and choosing it plans version 5 replacing 4 with +1 −0 ~0 — app-import-time.png</figcaption>
      <img src="app-import-time.png" alt="bench import sheet with taken_at selected as the time column and a planned version diff" />
    </figure>
    <figure>
      <figcaption>the corrected re-export: version 4 replaces 3 with +1 −2 ~1, and the strip names both versions on the tab — v2 recipe, v4 plot — app-version-diff.png</figcaption>
      <img src="app-version-diff.png" alt="bench window after a corrected export was imported as version 4" />
    </figure>
    <figure>
      <figcaption>a tab built from two versions: the strip reads v2, v3 (now v4) instead of naming only the first panel — app-mixed-versions.png</figcaption>
      <img src="app-mixed-versions.png" alt="bench window with a tab whose panels were drawn from versions 2 and 3 while the dataset is at 4" />
    </figure>
    <figure>
      <figcaption>the packaged build, launched with no Python on the machine — app-packaged.png</figcaption>
      <img src="app-packaged.png" alt="bench window captured from the standalone packaged executable" />
    </figure>
    <figure>
      <figcaption>QP Stats at 100%: altitude against its date field, one mark on a clock axis — app-field-pair-altitude-100.png</figcaption>
      <img src="app-field-pair-altitude-100.png" alt="bench window plotting altitude against date for a single QP Stats observation" />
    </figure>
    <figure>
      <figcaption>the same tab at 125% — app-field-pair-altitude-125.png</figcaption>
      <img src="app-field-pair-altitude-125.png" alt="bench window plotting altitude against date at 125% scaling" />
    </figure>
    <figure>
      <figcaption>the same tab at 150% — app-field-pair-altitude-150.png</figcaption>
      <img src="app-field-pair-altitude-150.png" alt="bench window plotting altitude against date at 150% scaling" />
    </figure>
    <figure>
      <figcaption>QP Stats at 100%: app against pps, the same one observed row on numeric axes — app-field-pair-100.png</figcaption>
      <img src="app-field-pair-100.png" alt="bench window plotting app against pps for a single QP Stats observation" />
    </figure>
    <figure>
      <figcaption>the numeric pair at 125% — app-field-pair-125.png</figcaption>
      <img src="app-field-pair-125.png" alt="bench window plotting app against pps at 125% scaling" />
    </figure>
    <figure>
      <figcaption>the numeric pair at 150% — app-field-pair-150.png</figcaption>
      <img src="app-field-pair-150.png" alt="bench window plotting app against pps at 150% scaling" />
    </figure>
    <figure>
      <figcaption>the tab dialog offers the selected shape's own fields, with date and altitude chosen — app-field-pair-dialog-100.png</figcaption>
      <img src="app-field-pair-dialog-100.png" alt="bench new-tab dialog with horizontal and vertical field pickers populated from the QP Stats shape" />
    </figure>
    <figure>
      <figcaption>the same dialog at 150%, unclipped — app-field-pair-dialog-150.png</figcaption>
      <img src="app-field-pair-dialog-150.png" alt="bench new-tab dialog with QP Stats fields at 150% scaling" />
    </figure>
  </body>
</html>
